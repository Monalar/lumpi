[package]
name = "lumpi"
version = "9.0.1"
edition = "2021"
description = "Columnar compression for flat JSONL and CSV logs — Zstd-19 ratio at 100x the speed, greps 3-10x faster than raw text"
license = "MIT"
repository = "https://github.com/Monalar/lumpi"
keywords = ["compression", "jsonl", "logs", "columnar", "zstd"]
categories = ["compression", "command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
zstd = { version = "0.13", features = ["zstdmt"] } 
flate2 = "1.0"
sha2 = "0.10"
hex = "0.4"
memchr = "2.7"
brotli = "7.0"
rustc-hash = "2.1.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "lumpi"
path = "src/main.rs"
