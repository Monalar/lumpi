[package]
name = "lumpi"
version = "9.0.5"
edition = "2021"
description = "Grep compressed JSONL/CSV log archives without decompressing. Columnar encoding reaches Zstd L19 ratio at L9 speed."
license = "Apache-2.0"
repository = "https://github.com/Monalar/lumpi"
keywords = ["compression", "jsonl", "logs", "columnar", "zstd"]
categories = ["compression", "command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
zstd = { version = "0.13", features = ["zstdmt"] } 
flate2 = "1.0"
sha2 = "0.10"
hex = "0.4"
memchr = "2.7"
brotli = "7.0"
rustc-hash = "2.1.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "lumpi"
path = "src/main.rs"
